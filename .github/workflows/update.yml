name: Auto Fetch Live Football Data

on:
  schedule:
    # প্রতি ১৫ মিনিট পর পর রান করার জন্য Cron Schedule
    - cron: '*/15 * * * *'
  workflow_dispatch: # গিটহাব থেকে ম্যানুয়ালি রান করার জন্য অপশন

jobs:
  build-and-update:
    runs-on: ubuntu-latest

    steps:
    # ১. রিপোজিটরির কোড চেকআউট করা
    - name: Checkout Repository
      uses: actions/checkout@v4

    # ২. পাইথন এনভায়রনমেন্ট সেটআপ করা
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    # ৩. পাইথন স্ক্রিপ্ট রান করা এবং Secrets থেকে API Key পাস করা
    - name: Run Python Script
      env:
        RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
      run: python main.py

    # ৪. নতুন সেভ হওয়া ডাটা গিটহাবে পুশ করা
    - name: Commit and Push Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add data/
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update football data [skip ci]" && git push)
